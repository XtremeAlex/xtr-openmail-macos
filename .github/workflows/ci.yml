name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Theme sync (salta il confronto con la web app se non presente)
        run: scripts/check-theme-sync.sh
